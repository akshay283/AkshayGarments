    // Helper for automatic multi-extension candidate resolution
    function getCategoryCandidates(folderName, basePrefixes = [], explicitImages = [], maxCount = 15) {
      const list = [...(explicitImages || [])];
      const extensions = ['jpeg', 'jpg', 'png', 'webp'];
      const prefixes = Array.isArray(basePrefixes) ? basePrefixes : [basePrefixes];

      prefixes.forEach((prefix) => {
        if (!prefix) return;
        for (let i = 1; i <= maxCount; i++) {
          extensions.forEach((ext) => {
            const candidate = `/images/manufacture/${folderName}/${prefix}-${i}.${ext}`;
            if (!list.includes(candidate)) {
              list.push(candidate);
            }
          });
        }
      });

      return list;
    }

    // Lightbox Popup Component for preview.html
    function PreviewLightboxModal({ images, activeIndex, isOpen, onClose, onIndexChange }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!isOpen) return;
          if (e.key === 'Escape') onClose();
          if (e.key === 'ArrowLeft') onIndexChange(activeIndex > 0 ? activeIndex - 1 : images.length - 1);
          if (e.key === 'ArrowRight') onIndexChange(activeIndex < images.length - 1 ? activeIndex + 1 : 0);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, activeIndex, images]);

      if (!isOpen || !images || images.length === 0) return null;

      const currentImg = images[activeIndex];

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-navy-950/95 backdrop-blur-md p-4 animate-fade-in"
          onClick={onClose}
        >
          {/* Top Bar */}
          <div className="absolute top-4 inset-x-4 flex items-center justify-between text-white z-20 pointer-events-none">
            <div className="bg-navy-900/90 backdrop-blur-md px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold border border-white/10">
              {activeIndex + 1} / {images.length} Photos
            </div>
            <button
              onClick={onClose}
              className="pointer-events-auto p-2 bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors"
              title="Close (Esc)"
            >
              ✕
            </button>
          </div>

          {/* Previous Arrow */}
          {images.length > 1 && (
            <button
              onClick={(e) => {
                e.stopPropagation();
                onIndexChange(activeIndex > 0 ? activeIndex - 1 : images.length - 1);
              }}
              className="absolute left-4 top-1/2 -translate-y-1/2 p-3.5 bg-white/10 hover:bg-brand-600 text-white rounded-full transition-all z-20 backdrop-blur-sm"
              title="Previous Photo"
            >
              ◀
            </button>
          )}

          {/* Main High-Res Image */}
          <div
            className="max-w-4xl max-h-[85vh] flex flex-col items-center justify-center p-2"
            onClick={(e) => e.stopPropagation()}
          >
            <img
              src={currentImg}
              alt=""
              className="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl animate-fade-in border border-white/10"
            />
          </div>

          {/* Next Arrow */}
          {images.length > 1 && (
            <button
              onClick={(e) => {
                e.stopPropagation();
                onIndexChange(activeIndex < images.length - 1 ? activeIndex + 1 : 0);
              }}
              className="absolute right-4 top-1/2 -translate-y-1/2 p-3.5 bg-white/10 hover:bg-brand-600 text-white rounded-full transition-all z-20 backdrop-blur-sm"
              title="Next Photo"
            >
              ▶
            </button>
          )}
        </div>
      );
    }

    // CardImageSlider Component for Auto-sliding Garment Photos with Lightbox Popup
    function CardImageSlider({ images, alt, aspectRatioClass = "aspect-[16/11]" }) {
      const resolveImagePath = (src) => {
        if (!src) return '';
        if (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('data:')) return src;
        if (typeof window !== 'undefined' && (window.location.protocol === 'file:' || !window.location.protocol)) {
          if (src.startsWith('/images/')) return './public' + src;
          if (src.startsWith('images/')) return './public/' + src;
          if (src.startsWith('/public/')) return '.' + src;
          if (src.startsWith('public/')) return './' + src;
          return src;
        }
        if (src.startsWith('/public/')) return src.replace('/public', '');
        if (src.startsWith('public/')) return src.replace('public', '');
        if (!src.startsWith('/')) return '/' + src;
        return src;
      };

      const initialList = Array.isArray(images) && images.length > 0
        ? images
        : [images || 'https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=800&auto=format&fit=crop'];

      const [validImages, setValidImages] = useState(initialList);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isHovered, setIsHovered] = useState(false);
      const [isLightboxOpen, setIsLightboxOpen] = useState(false);

      useEffect(() => {
        let isMounted = true;
        const candidates = Array.isArray(images) && images.length > 0 ? images : ['https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=800&auto=format&fit=crop'];
        if (candidates.length <= 1) {
          setValidImages(candidates);
          return;
        }

        const verified = [];
        let pending = candidates.length;

        candidates.forEach((src) => {
          const resolved = resolveImagePath(src);
          const img = new Image();
          img.onload = () => {
            if (isMounted) {
              verified.push(src);
              pending--;
              if (pending === 0) {
                setValidImages(verified.length > 0 ? verified : ['https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=800&auto=format&fit=crop']);
              }
            }
          };
          img.onerror = () => {
            if (isMounted) {
              pending--;
              if (pending === 0) {
                setValidImages(verified.length > 0 ? verified : ['https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=800&auto=format&fit=crop']);
              }
            }
          };
          img.src = resolved;
        });

        return () => { isMounted = false; };
      }, [JSON.stringify(images)]);

      const total = validImages.length;

      useEffect(() => {
        if (total <= 1 || isHovered || isLightboxOpen) return;
        const interval = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % total);
        }, 3500);
        return () => clearInterval(interval);
      }, [total, isHovered, isLightboxOpen]);

      const currentSrc = validImages[currentIndex]
        ? resolveImagePath(validImages[currentIndex])
        : 'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=800&auto=format&fit=crop';

      return (
        <>
          <div
            className={`relative ${aspectRatioClass} overflow-hidden bg-slate-100 group/slider select-none cursor-pointer`}
            onMouseEnter={() => setIsHovered(true)}
            onMouseLeave={() => setIsHovered(false)}
            onClick={() => setIsLightboxOpen(true)}
            title="Click to open full photo popup"
          >
            <img
              src={currentSrc}
              alt={alt}
              onError={() => {
                setValidImages((prev) => {
                  const next = prev.filter((_, idx) => idx !== currentIndex);
                  return next.length > 0 ? next : ['https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=800&auto=format&fit=crop'];
                });
              }}
              className="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
            />
            <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-black/20 pointer-events-none" />

            {/* Click to Enlarge Badge */}
            <div className="absolute inset-0 bg-navy-950/25 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
              <div className="px-3.5 py-1.5 rounded-full bg-navy-950/85 backdrop-blur-md text-white text-xs font-bold shadow-lg flex items-center gap-1.5 border border-white/20 transform translate-y-2 group-hover:translate-y-0 transition-transform">
                <span>🔍 Click to Enlarge</span>
              </div>
            </div>

            {total > 1 && (
              <>
                <div className="absolute bottom-2.5 right-2.5 z-10 px-2 py-0.5 rounded-md bg-navy-950/80 backdrop-blur-md text-white text-[10px] font-bold border border-white/10 shadow-sm flex items-center gap-1 pointer-events-none">
                  <span>{currentIndex + 1}/{total} Photos</span>
                </div>
                <button
                  onClick={(e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev - 1 + total) % total); }}
                  className="absolute left-2 top-1/2 -translate-y-1/2 z-10 w-7 h-7 rounded-full bg-navy-950/70 hover:bg-brand-600 text-white flex items-center justify-center opacity-0 group-hover/slider:opacity-100 transition-all shadow-md active:scale-90"
                >
                  ◀
                </button>
                <button
                  onClick={(e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev + 1) % total); }}
                  className="absolute right-2 top-1/2 -translate-y-1/2 z-10 w-7 h-7 rounded-full bg-navy-950/70 hover:bg-brand-600 text-white flex items-center justify-center opacity-0 group-hover/slider:opacity-100 transition-all shadow-md active:scale-90"
                >
                  ▶
                </button>
                <div className="absolute bottom-2.5 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1 px-2 py-1 rounded-full bg-navy-950/60 backdrop-blur-md border border-white/10">
                  {validImages.map((_, idx) => (
                    <button
                      key={idx}
                      onClick={(e) => { e.stopPropagation(); setCurrentIndex(idx); }}
                      className={`rounded-full transition-all ${currentIndex === idx ? 'w-4 h-1 bg-brand-400' : 'w-1.5 h-1.5 bg-white/50'}`}
                    />
                  ))}
                </div>
              </>
            )}
          </div>

          <PreviewLightboxModal
            images={validImages.map((img) => resolveImagePath(img))}
            activeIndex={currentIndex}
            isOpen={isLightboxOpen}
            onClose={() => setIsLightboxOpen(false)}
            onIndexChange={(newIdx) => setCurrentIndex(newIdx)}
          />
        </>
      );
    }

          </main>

          {/* Footer */}
          <footer className="bg-navy-950 text-slate-400 py-12 px-4 sm:px-6 lg:px-8 border-t border-navy-900 text-xs">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
              <div>
                <div className="font-display font-black text-lg text-white">AKSHAY GARMENTS</div>
                <p className="text-[11px] text-slate-500 mt-1">© {new Date().getFullYear()} Akshay Garments. All Rights Reserved.</p>
              </div>
              <div className="flex gap-4">
                {navItems.map((n) => (
                  <button key={n.id} onClick={() => setActivePage(n.id)} className="hover:text-white">
                    {n.label}
                  </button>
                ))}
              </div>
            </div>
          </footer>

          {/* Floating WhatsApp Button */}
          <a
            href={`https://wa.me/${siteConfig.contact.whatsapp}?text=${encodeURIComponent('Hello Akshay Garments! I would like to enquire about school uniforms.')}`}
            target="_blank"
            rel="noopener noreferrer"
            className="fixed bottom-6 left-6 z-40 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase rounded-full shadow-2xl flex items-center gap-2"
          >
            <span>💬</span>
            <span className="hidden sm:inline">WhatsApp Us</span>
          </a>

          {/* Global Search Modal */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 bg-navy-950/80 backdrop-blur-md">
              <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search school shirts, blazers, pants, uniform models..."
                    className="w-full text-base font-medium focus:outline-none"
                    autoFocus
                  />
                  <button onClick={() => setIsSearchOpen(false)} className="text-slate-400 hover:text-slate-700">✕</button>
                </div>
                <div className="max-h-60 overflow-y-auto space-y-2 text-xs">
                  {productsData.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase())).map((item) => (
                    <div
                      key={item.id}
                      onClick={() => {
                        setIsSearchOpen(false);
                        setQuoteModalData({ title: item.name, type: 'search-item' });
                      }}
                      className="p-2 hover:bg-slate-50 rounded-lg cursor-pointer flex justify-between"
                    >
                      <span className="font-bold text-slate-800">{item.name}</span>
                      <span className="text-slate-400">{item.category}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Quote Modal */}
          {quoteModalData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/80 backdrop-blur-md">
              <div className="w-full max-w-lg bg-white rounded-3xl p-6 sm:p-8 space-y-4 relative shadow-2xl animate-slide-up">
                <button onClick={() => setQuoteModalData(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">✕</button>
                <h3 className="font-display font-bold text-xl text-navy-950">Request Institutional Quote</h3>
                <p className="text-xs text-slate-500">Regarding: <strong className="text-brand-700">{quoteModalData.title}</strong></p>

                {formSubmitted ? (
                  <div className="text-center py-6 space-y-2">
                    <div className="text-3xl">✅</div>
                    <div className="font-bold text-base text-navy-950">Quote Request Dispatched!</div>
                    <p className="text-xs text-slate-500">We will contact you shortly.</p>
                    <button onClick={() => { setFormSubmitted(false); setQuoteModalData(null); }} className="mt-2 px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">
                      Close
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleQuoteSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold mb-1">Your Name *</label>
                      <input required type="text" placeholder="Dr. Sharma" className="w-full p-2.5 bg-slate-50 border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Phone / WhatsApp Number *</label>
                      <input required type="tel" placeholder="+91 98765 43210" className="w-full p-2.5 bg-slate-50 border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">School Name *</label>
                      <input required type="text" placeholder="St. Peter's Academy" className="w-full p-2.5 bg-slate-50 border rounded-xl" />
                    </div>
                    <button type="submit" className="w-full py-3 bg-brand-600 text-white font-bold uppercase rounded-xl">
                      Submit Request
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
